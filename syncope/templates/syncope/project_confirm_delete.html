{% extends "syncope/base.html" %}

{% block title %}Delete Project{% endblock %}

{% block content %}
<h2>Delete Project?</h2>

<p>Are you sure you want to delete <strong>{{ project.title }}</strong>?</p>

{% if can_delete %}
<form method="post">
    {% csrf_token %}
    <div class="form-actions">
        <a href="{% url 'syncope:project_detail' url_username project.pk %}" class="btn btn-link">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
    </div>
</form>
{% else %}
<p><a href="{%  url 'syncope:project_detail' url_username project.pk %}">Back to Project</a></p>
{% endif %}

{% endblock %}
